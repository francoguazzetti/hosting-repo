{% extends "posts/base.html" %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block contenido %}
<h1>Nueva contraseña</h1>
{% if not validlink %}<p>El enlace no es válido o ya fue usado. <a href="{% url 'password_reset' %}">Pedí uno nuevo</a>.</p>{% endif %}
{% if validlink %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar</button>
</form>
{% endif %}

{% endblock %}
