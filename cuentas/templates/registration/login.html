{% extends "posts/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<h1>Ingresar</h1>
{% if next %}<p class="meta">Necesitás iniciar sesión para ver esa página.</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Ingresar</button>
</form>
<p><a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a> · <a href="{% url 'registro' %}">Crear cuenta</a></p>
{% endblock %}
