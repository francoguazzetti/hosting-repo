{% extends "posts/base.html" %}
{% block titulo %}Eliminar post{% endblock %}
{% block contenido %}
<h1>Eliminar post</h1>
<p>¿Estás seguro de que querés eliminar "<strong>{{ post.titulo }}</strong>"?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit">Sí, eliminar</button>
  <a href="{% url 'detalle_post' post.slug %}">Cancelar</a>
</form>
{% endblock %}
